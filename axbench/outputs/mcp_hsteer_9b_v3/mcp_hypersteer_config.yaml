generate:
  lm_model: openai/gpt-5.4-nano
  input_length: 32
  output_length: 32
  num_of_examples: 12
  concept_path: axbench/outputs/mcp_hsteer_9b_v3/merged_concepts_mcp.json
  dataset_category: instruction
  master_data_dir: axbench/data
  seed: 42
  keep_orig_axbench_format: true
train:
  model_name: google/gemma-2-9b-it
  layer: 20
  component: res
  seed: 42
  use_bf16: true
  output_length: 256
  models:
    HyperSteer:
      batch_size: 1
      gradient_accumulation_steps: 8
      n_epochs: 5
      lr: 2.0e-05
      weight_decay: 0.0
      low_rank_dimension: 1
      intervention_positions: all
      intervention_type: addition
      binarize_dataset: false
      train_on_negative: false
      exclude_bos: true
      hypernet_name_or_path: google/gemma-2-9b-it
      num_hidden_layers: 4
      hypernet_initialize_from_pretrained: true
inference:
  use_bf16: true
  models:
    - HyperSteer
  model_name: google/gemma-2-9b-it
  output_length: 256
  latent_num_of_examples: 36
  latent_batch_size: 16
  steering_intervention_type: addition
  steering_model_name: google/gemma-2-9b-it
  steering_datasets:
    - AlpacaEval
  steering_batch_size: 10
  steering_output_length: 256
  steering_layers:
    - 10
  steering_num_of_examples: 10
  steering_factors: [0.0, 0.5, 1.0, 1.5, 2.0]
  master_data_dir: axbench/data
  seed: 42
  lm_model: openai/gpt-5.4-nano
  temperature: 1.0
evaluate:
  models:
    - HyperSteer
  latent_evaluators:
    - AUCROCEvaluator
    - HardNegativeEvaluator
  steering_evaluators:
    - LMJudgeEvaluator
  winrate_split_ratio: 0.5
  num_of_workers: 32
  lm_model: openai/gpt-5.4-nano
  run_winrate: false
  winrate_baseline: PromptSteering
  master_data_dir: axbench/data
