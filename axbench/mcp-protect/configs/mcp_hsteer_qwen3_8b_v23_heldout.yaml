# v23 — generalization probe (C4): retrain v22 on 8/12 archetypes, test on all 12.
#
# Trained cids (original v22 indices): 0,1,2,3,4,5,6,10
# Held-out cids (eval-only):           7,8,9,11
#
# Hyperparams identical to v22_multi (L20 res, rank-1 addition, lr=2e-5, 5 epochs,
# max_input_length=2048). Only differences: data path -> v23, max_concepts: 8,
# concept_path -> v23 trained concepts. At eval, the chain script drives all 12
# cids by switching HYPERSTEER_CONCEPT_ID — it does NOT need a separate eval-only
# concept set in this YAML; the hypernet conditions on whatever concept text is
# fed at serve time.
#
# NOTE: this YAML's `concept_path` lists only the 8 trained concepts. For the
# held-out probe, the chain script reads v23_FULL_concepts.jsonl directly and
# feeds the held-out concept descriptions to the serve process via concept-id.
generate:
  lm_model: openai/gpt-5.4-nano
  input_length: 32
  output_length: 32
  num_of_examples: 1
  concept_path: /home/ubuntu/mcp-protect/axbench/axbench/data/v23_concepts.jsonl
  dataset_category: instruction
  master_data_dir: axbench/data
  seed: 42
  keep_orig_axbench_format: true
train:
  model_name: Qwen/Qwen3-8B
  layer: 20
  component: res
  seed: 42
  use_bf16: true
  output_length: 2048
  max_concepts: 8
  models:
    HyperSteer:
      batch_size: 8
      gradient_accumulation_steps: 1
      n_epochs: 5
      lr: 2.0000e-05
      weight_decay: 0.0
      low_rank_dimension: 1
      intervention_positions: all
      intervention_type: addition
      binarize_dataset: false
      train_on_negative: false
      exclude_bos: true
      hypernet_name_or_path: Qwen/Qwen3-8B
      num_hidden_layers: 4
      hypernet_initialize_from_pretrained: true
      max_input_length: 2048
      max_concept_length: 1024
inference:
  use_bf16: true
  models:
    - HyperSteer
  model_name: Qwen/Qwen3-8B
  output_length: 2048
  steering_intervention_type: addition
  steering_model_name: Qwen/Qwen3-8B
  steering_layers:
    - 20
  master_data_dir: axbench/data
  seed: 42
  lm_model: openai/gpt-5.4-nano
  temperature: 1.0
