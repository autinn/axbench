# Phase G — broad-concept HyperSteer for concept-space search at inference.
#
# §15 of EXPERIMENT_HANDOFF.md. ~398 in-domain concepts (12 v22 archetypes +
# paraphrases + generic security + refusal patterns + benign tool-use awareness
# + AxBench-style background). Target ~7-8K filtered rows from ~12K raw.
#
# Hyperparameters identical to v22/v23 (HyperSteer L20, rank-1 addition, lr=2e-5,
# 5 epochs, max_input_length=2048, max_concept_length=1024). Only meaningful
# difference vs. v23: max_concepts bumped to cover all ~400 trained cids.
#
# Train output dir (Box B convention): axbench/outputs/mcp_hsteer_qwen3_8b_vG_broad/
# Concept file:                        axbench/data/vG_concepts.jsonl
# Train data:                          axbench/data/vG_train_data.parquet
generate:
  lm_model: openai/gpt-5.4-nano
  input_length: 32
  output_length: 32
  num_of_examples: 1
  concept_path: /home/ubuntu/mcp-protect/axbench/axbench/data/vG_concepts.jsonl
  dataset_category: instruction
  master_data_dir: axbench/data
  seed: 42
  keep_orig_axbench_format: true
train:
  model_name: Qwen/Qwen3-8B
  layer: 20
  component: res
  seed: 42
  use_bf16: true
  output_length: 2048
  max_concepts: 400
  models:
    HyperSteer:
      batch_size: 16
      gradient_accumulation_steps: 1
      n_epochs: 5
      lr: 2.0000e-05
      weight_decay: 0.0
      low_rank_dimension: 1
      intervention_positions: all
      intervention_type: addition
      binarize_dataset: false
      train_on_negative: false
      exclude_bos: true
      hypernet_name_or_path: Qwen/Qwen3-8B
      num_hidden_layers: 4
      hypernet_initialize_from_pretrained: true
      max_input_length: 2048
      max_concept_length: 1024
inference:
  use_bf16: true
  models:
    - HyperSteer
  model_name: Qwen/Qwen3-8B
  output_length: 2048
  steering_intervention_type: addition
  steering_model_name: Qwen/Qwen3-8B
  steering_layers:
    - 20
  master_data_dir: axbench/data
  seed: 42
  lm_model: openai/gpt-5.4-nano
  temperature: 1.0
